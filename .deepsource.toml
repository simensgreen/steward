version = 1

# Intentionally omit the javascript analyzer: DeepSource raises rule-fit false
# positives on Solid+TS ESM (JS-0067 exports, JS-0098 void, JS-0415 JSX depth)
# and repo-scoped muting is dashboard-only. Web lint/types are gated by Biome +
# tsc (`npm run check` in web/). Re-add javascript after muting those rules.

[[analyzers]]
name = "rust"
enabled = true

[[analyzers]]
name = "sql"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
