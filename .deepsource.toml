version = 1

# Exclude the Solid web app from DeepSource JS analysis. Rules JS-0067 / JS-0415
# are rule-fit false positives for ESM Solid JSX (module exports + intentional UI
# nesting). skipcq on return lines does not silence nesting reported on deeper
# child nodes. Web quality is gated by Biome + tsc (`npm run check` in web/).
exclude_patterns = [
  "web/**",
  "**/node_modules/**",
  "**/dist/**",
  "target/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  dialect = "typescript"
  module_system = "es-modules"
  environment = ["browser", "nodejs"]
  cyclomatic_complexity_threshold = "critical"
  dependency_file_paths = ["web"]

[[analyzers]]
name = "rust"
enabled = true

[[analyzers]]
name = "sql"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "shell"
enabled = true
